name: Release Build (Win / Mac / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows (Qt6) ──
          - os: windows-latest
            setup-cmd: |
              pip install -r windows-standalone/requirements.txt
              pip install -e .
            spec-path: windows-standalone/tradewin.spec
            artifact-glob: windows-standalone/dist/TradeWin*.exe
            asset-suffix: ".exe"

          # ── macOS (pywebview → .app.zip) ──
          - os: macos-latest
            setup-cmd: |
              pip install -e ".[desktop]"
              pip install pyinstaller>=6.0
            spec-path: tradewin-mac.spec
            artifact-glob: dist/TradeWin-*.zip
            asset-suffix: "-macOS.zip"
            post-build: |
              cd dist
              zip -r "TradeWin-${VER}-macOS.zip" "TradeWin.app"
              rm -rf "TradeWin.app"

          # ── Linux (pywebview → binary) ──
          - os: ubuntu-latest
            setup-cmd: |
              sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev
              pip install -e ".[desktop]"
              pip install pyinstaller>=6.0
            spec-path: tradewin-linux.spec
            artifact-glob: dist/TradeWin
            asset-suffix: "-linux"
            post-build: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      # Windows 长路径
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      # 安装依赖
      - name: Install dependencies
        shell: bash
        run: ${{ matrix.setup-cmd }}

      # Hermes（失败不阻断）
      - name: Install Hermes Agent
        run: pip install hermes-agent
        continue-on-error: true

      # 清理旧构建
      - name: Clean old builds
        shell: bash
        run: rm -rf build dist

      # PyInstaller
      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm ${{ matrix.spec-path }}

      # 提取版本号
      - name: Get version
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          echo "ver=$VER" >> $GITHUB_OUTPUT

      # 后处理（macOS 打包 .zip）
      - name: Post-build
        if: matrix.post-build != ''
        shell: bash
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: ${{ matrix.post-build }}

      # Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: TradeWin-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          retention-days: 30

      # 验证
      - name: Verify artifact
        shell: bash
        run: |
          for f in ${{ matrix.artifact-glob }}; do
            if [ -f "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              echo "✓ $f ($SIZE)"
            elif [ -d "$f" ]; then
              echo "✓ $f (directory)"
            else
              echo "::warning::Expected artifact not found: $f"
            fi
          done

      # 附加到 Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-glob }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
