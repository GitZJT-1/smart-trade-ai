name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手动触发：发布/部署前全量验证

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Python syntax check
        run: |
          python -m compileall -q trade/ server.py
          echo "✓ All files compile successfully"
      - run: ruff check trade/ server.py

  detect:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5

      # 全量测试铁律（2026-07-31 用户定）：只有代码/配置/依赖/测试本体变更才跑全量。
      # skill 文档（skills/）、README、docs/ 等非代码改动跳过全量测试矩阵。
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'trade/**'
              - 'server.py'
              - 'tradewin.py'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'tests/**'
              - '.github/workflows/test.yml'

      - name: Skip notice (no code changes)
        if: steps.filter.outputs.code == 'false' && github.event_name != 'workflow_dispatch'
        run: echo "✓ 无代码变更（仅 skill/文档），跳过全量测试矩阵"

  test:
    needs: [lint, detect]
    if: needs.detect.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install fastapi "uvicorn[standard]" pydantic pyyaml packaging python-multipart
          pip install pymupdf openpyxl python-docx python-pptx xlrd beautifulsoup4
          pip install cryptography psutil dnspython
          pip install openai==2.24.0 anthropic==0.87.0 pytesseract
          pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest tests/ -v
